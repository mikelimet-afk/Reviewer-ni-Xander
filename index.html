<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6b3a">
<title>Tamaraw Prep – FEUCAT Reviewer (Unofficial)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="herd" aria-hidden="true">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- original tamaraw (dwarf buffalo) silhouette: stocky body, short legs, V-shaped horns -->
      <symbol id="tam" viewBox="0 0 120 80">
        <path d="M14 30c4-8 14-12 26-12h34c8 0 14 2 18 6l6-6c2-2 5-3 8-2l-2 5 6-2c2 2 2 5 0 7l-4 3c2 4 2 8 0 11l-6 4c-2 1-5 1-7 0l-4-2v4c0 3-1 6-3 8l2 14h-7l-3-12h-4l-1 12h-7l-1-13c-6 1-14 1-21 0l-2 13h-7l-1-13h-3l-2 13h-7l1-15c-4-3-6-8-6-13-4 0-7 3-8 7l-3-1c1-6 5-10 10-11z"/>
        <path d="M99 18c-2-6-1-12 3-16-1 5 0 9 2 12zM108 18c1-6 5-10 10-12-3 4-4 8-4 12z"/>
      </symbol>
      <!-- emblem: shield with a tamaraw head and horns -->
      <symbol id="tamem" viewBox="0 0 80 90">
        <path d="M40 3l33 10v26c0 22-14 38-33 47C21 77 7 61 7 39V13z" fill="none" stroke="currentColor" stroke-width="4"/>
        <path d="M22 26c-4-6-4-12 0-16 0 6 3 10 8 12zM58 26c4-6 4-12 0-16 0 6-3 10-8 12z"/>
        <path d="M28 28c3-3 7-4 12-4s9 1 12 4c3 4 3 10 1 16l-4 12c-2 5-5 8-9 8s-7-3-9-8l-4-12c-2-6-2-12 1-16z"/>
        <circle cx="34" cy="36" r="2.6" fill="var(--card, #fff)"/><circle cx="46" cy="36" r="2.6" fill="var(--card, #fff)"/>
        <ellipse cx="40" cy="55" rx="6" ry="3.5" fill="var(--card, #fff)"/>
      </symbol>
    </defs>
  </svg>
  <svg class="t t1"><use href="#tam"/></svg>
  <svg class="t t2"><use href="#tamem"/></svg>
  <svg class="t t3"><use href="#tam"/></svg>
  <svg class="t t4"><use href="#tamem"/></svg>
  <svg class="t t5"><use href="#tam"/></svg>
  <svg class="t t6"><use href="#tam"/></svg>
</div>
<header class="top">
  <button class="brand" data-act="home"><span class="logo"><svg viewBox="0 0 80 90" width="20" height="22"><use href="#tamem"/></svg></span><span class="bname">Tamaraw Prep</span></button>
  <nav>
    <button data-act="learn">Learn</button>
    <button data-act="history">Progress</button>
    <button data-act="settings">Settings</button>
    <button data-act="tips">Tips</button>
  </nav>
</header>
<main id="app"></main>
<footer class="foot">Unofficial practice reviewer. Not affiliated with or endorsed by Far Eastern University. Scores are saved only on this device.</footer>

<script>
  window.BANK = []; window.PASSAGES = {};
  (function () {
    var n = {}, lvl = 1;
    // Q(section, topic, question, [CORRECT, wrong, wrong, wrong], explanation, passageId)
    // The correct answer is always listed first; the app shuffles the choices.
    // D(3) marks the questions that follow as "Real exam" level; D(1) switches back to Easy.
    window.D = function (l) { lvl = l; };
    window.Q = function (sec, topic, q, c, exp, p) {
      var k = sec + '.' + topic; n[k] = (n[k] || 0) + 1;
      BANK.push({ id: k + '.' + n[k], sec: sec, topic: topic, q: q, c: c, exp: exp, p: p || null, lv: lvl });
    };
    window.P = function (id, title, text) { PASSAGES[id] = { title: title, text: text, lv: lvl }; };
  })();
</script>
<script src="q-english.js"></script>
<script src="q-math.js"></script>
<script src="q-science.js"></script>
<script src="q-reasoning.js"></script>
<script src="q-real-english.js"></script>
<script src="q-real-math.js"></script>
<script src="q-real-science.js"></script>
<script src="q-real-reasoning.js"></script>
<script src="app.js"></script>
<script src="learn-math.js"></script>
<script src="learn-science.js"></script>
<script src="learn-language.js"></script>
</body>
</html>
