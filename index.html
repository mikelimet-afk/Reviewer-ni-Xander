<div class="herd" aria-hidden="true">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Original one-line drawing of a tamaraw (Bubalus mindorensis), side view facing right:
           stocky low body, shoulder hump, heavy head held low, short horns swept back in a V,
           small sideways ear, tapered legs, long tail ending in a tuft. One continuous stroke. -->
      <symbol id="tam" viewBox="0 0 240 150">
        <path class="line" pathLength="1" d="M57 120C53 117 53 110 57 108C58 92 59 72 63 56C65 49 70 45 77 43C96 40 110 39 122 36C132 34 138 30 145 30C153 30 158 36 164 42C169 46 173 48 177 49C171 40 161 30 147 25C158 29 168 38 181 47C177 37 169 29 157 23C168 28 177 37 186 46C184 52 179 55 170 59C177 61 183 60 187 57C193 66 200 79 206 88C210 93 211 98 207 101C202 104 195 103 190 100C184 99 179 101 174 104C169 107 166 111 163 115C162 121 161 127 160 132C160 135 162 137 163 139L152 139C153 133 152 127 151 120C150 117 149 115 147 114C146 121 145 129 145 139L137 139C138 131 138 123 138 117C124 118 108 118 96 115C93 120 90 125 88 130C88 134 89 137 90 139L80 139C80 134 79 129 77 125C73 121 70 115 68 107C65 97 64 86 65 76C66 66 68 59 72 54"/>
      </symbol>
      <!-- Emblem: shield with a one-line front view of a tamaraw head (V horns, sideways ears, long face) -->
      <symbol id="tamem" viewBox="0 0 80 90">
        <path class="line" pathLength="1" d="M40 4L72 14V40C72 61 58 76 40 86C22 76 8 61 8 40V14Z"/>
        <path class="line" pathLength="1" d="M18 17C23 26 29 33 35 38C29 42 23 44 17 43C21 48 28 50 34 49C34 59 35 68 37 75C38 79 39 81 40 81C41 81 42 79 43 75C45 68 46 59 46 49C52 50 59 48 63 43C57 44 51 42 45 38C51 33 57 26 62 17"/>
      </symbol>
    </defs>
  </svg>
  <svg class="t t1"><use href="#tam"/></svg>
  <svg class="t t2"><use href="#tamem"/></svg>
  <svg class="t t3"><use href="#tam"/></svg>
  <svg class="t t4"><use href="#tamem"/></svg>
  <svg class="t t5"><use href="#tam"/></svg>
  <svg class="t t6"><use href="#tam"/></svg>
</div>
<header class="top">
  <button class="brand" data-act="home"><span class="logo"><svg viewBox="0 0 80 90" width="20" height="22"><use href="#tamem"/></svg></span><span class="bname">Tamaraw Prep</span></button>
  <nav>
    <button data-act="learn">Learn</button>
    <button data-act="history">Progress</button>
    <button data-act="settings">Settings</button>
    <button data-act="tips">Tips</button>
    <button data-act="aiopen">✨ AI</button>
  </nav>
</header>
<main id="app"></main>
<footer class="foot">Unofficial practice reviewer. Not affiliated with or endorsed by Far Eastern University. Scores are saved only on this device.</footer>

<script>
  window.BANK = []; window.PASSAGES = {};
  (function () {
    var n = {}, lvl = 1;
    // Q(section, topic, question, [CORRECT, wrong, wrong, wrong], explanation, passageId)
    // The correct answer is always listed first; the app shuffles the choices.
    // D(3) marks the questions that follow as "Real exam" level; D(1) switches back to Easy.
    window.D = function (l) { lvl = l; };
    window.Q = function (sec, topic, q, c, exp, p) {
      var k = sec + '.' + topic; n[k] = (n[k] || 0) + 1;
      BANK.push({ id: k + '.' + n[k], sec: sec, topic: topic, q: q, c: c, exp: exp, p: p || null, lv: lvl });
    };
    window.P = function (id, title, text) { PASSAGES[id] = { title: title, text: text, lv: lvl }; };
  })();
</script>
